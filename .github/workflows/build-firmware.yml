# .github/workflows/build-firmware.yml
#
# 用途: 在你 fork 的 ai-passport 仓库上, 每次 push 自动编译并发布 .bin 到 Releases.
# 这样你不用装 ESP-IDF, 直接从 Releases 页面下载 .bin, 用 https://tool.folotoy.com/ 刷入.

name: Build Firmware

on:
  push:
    branches: [main]
  workflow_dispatch:  # 允许手动触发

permissions:
  contents: write  # 创建 Release 需要

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install host deps
        run: |
          sudo apt-get update
          sudo apt-get install -y git wget flex bison gperf python3 python3-pip \
            python3-venv cmake ninja-build ccache libffi-dev libssl-dev \
            dfu-util libusb-1.0-0

      - name: Install ESP-IDF v5.5.3
        run: |
          if [ ! -d "$HOME/esp/esp-idf-v5.5.3" ]; then
            mkdir -p "$HOME/esp"
            cd "$HOME/esp"
            # 用完整 clone (不带 --depth),因为 ESP-IDF 依赖很多 git submodule
            git clone --recursive --branch v5.5.3 \
              https://github.com/espressif/esp-idf.git esp-idf-v5.5.3
            cd esp-idf-v5.5.3
            ./install.sh esp32c3
          else
            echo "ESP-IDF already installed, skipping"
          fi
          echo "ESP_IDF_PATH=$HOME/esp/esp-idf-v5.5.3" >> "$GITHUB_ENV"

      # 把所有需要 ESP-IDF 环境的命令集中在一个 step 内,
      # source 一次后整个 step 内的命令都能用 idf.py.
      # 不使用 set -e,这样即使 build 失败我们也能看到完整日志.
      - name: Build firmware
        run: |
          source "$HOME/esp/esp-idf-v5.5.3/export.sh" > /dev/null 2>&1 || {
            echo "ERROR: failed to source export.sh"
            cat "$HOME/esp/esp-idf-v5.5.3/export.sh" | head -50
            exit 1
          }
          echo "idf.py: $(which idf.py)"
          idf.py --version
          echo "=== set-target ==="
          idf.py set-target esp32c3 || true
          echo "=== reconfigure ==="
          idf.py reconfigure || true
          echo "=== build ==="
          idf.py build 2>&1 | tee build.log
          echo "=== build done ==="
          echo "build dir contents:"
          ls -la build/ 2>&1 | head -30
          echo "Looking for bin:"
          find build -name "*.bin" 2>&1 | head

      - name: Show build size
        if: always()
        run: |
          echo "=== build dir ==="
          ls -la build/ 2>&1 | head -30 || echo "no build dir"
          echo "=== find .bin ==="
          find build -name "*.bin" 2>&1 | head || echo "no bin found"

      - name: Upload build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log

      - name: Rename artifact
        if: success()
        run: |
          cp build/ai-passport.bin ai-passport-diy.bin
          sha256sum ai-passport-diy.bin > ai-passport-diy.bin.sha256
          ls -lh ai-passport-diy.bin

      - name: Create Release
        if: success()
        uses: softprops/action-gh-release@v2
        with:
          tag_name: diy-${{ github.run_number }}-${{ github.sha }}
          name: "DIY Firmware ${{ github.run_number }}"
          draft: false
          prerelease: true
          body: |
            ## DIY Firmware Build

            This release is automatically built from the `main` branch of your fork.

            ### How to flash

            1. Download `ai-passport-diy.bin` below
            2. Open https://tool.folotoy.com/ in Chrome / Edge
            3. Click "刷机" (Flash) → connect USB → choose file → write at `0x0`
            4. Power-cycle Passport, you'll see the new 7-item menu including `Quick`

            ### Files

            - `ai-passport-diy.bin` — merge image, write at 0x0
            - `ai-passport-diy.bin.sha256` — checksum for verification

            ### Verify build commit

            `${{ github.sha }}` on `${{ github.ref_name }}`
          files: |
            ai-passport-diy.bin
            ai-passport-diy.bin.sha256
