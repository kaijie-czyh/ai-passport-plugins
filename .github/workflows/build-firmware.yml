# .github/workflows/build-firmware.yml
#
# 用途: 在你 fork 的 ai-passport 仓库上, 每次 push 自动编译并发布 .bin 到 Releases.
# 这样你不用装 ESP-IDF, 直接从 Releases 页面下载 .bin, 用 https://tool.folotoy.com/ 刷入.

name: Build Firmware

on:
  push:
    branches: [main]
  workflow_dispatch:  # 允许手动触发

permissions:
  contents: write  # 创建 Release 需要

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install host deps
        run: |
          sudo apt-get update
          sudo apt-get install -y git wget flex bison gperf python3 python3-pip \
            python3-venv cmake ninja-build ccache libffi-dev libssl-dev \
            dfu-util libusb-1.0-0

      - name: Install ESP-IDF v5.5.3
        run: |
          if [ ! -d "$HOME/esp/esp-idf-v5.5.3" ]; then
            mkdir -p "$HOME/esp"
            cd "$HOME/esp"
            git clone --recursive --branch v5.5.3 \
              https://github.com/espressif/esp-idf.git esp-idf-v5.5.3
            cd esp-idf-v5.5.3
            ./install.sh esp32c3
          else
            echo "ESP-IDF already installed, skipping"
          fi
          echo "ESP_IDF_PATH=$HOME/esp/esp-idf-v5.5.3" >> "$GITHUB_ENV"

      - name: Build firmware
        run: |
          source "$HOME/esp/esp-idf-v5.5.3/export.sh" > /dev/null 2>&1 || {
            echo "ERROR: failed to source export.sh"
            exit 1
          }
          echo "idf.py: $(which idf.py)"
          idf.py --version
          idf.py set-target esp32c3
          idf.py reconfigure
          idf.py build 2>&1 | tee build.log
          echo "=== build artifacts ==="
          find build -maxdepth 2 -name "*.bin" 2>&1
          ls -lh build/ | head -20

      - name: Upload build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log

      # ESP-IDF 产物文件名由 project() 决定 — 原仓库是 "FoloToy-AI-Passport".
      # 我们的 fork 仓库名是 ai-passport-plugins, 但 CMakeLists 里 project() 还是
      # FoloToy-AI-Passport, 所以产物是 build/FoloToy-AI-Passport.bin.
      - name: Locate and rename artifact
        if: success()
        run: |
          echo "=== build dir ==="
          ls -la build/
          echo "=== find .bin ==="
          BIN=$(find build -maxdepth 2 -name "*.bin" | head -1)
          if [ -z "$BIN" ]; then
            echo "ERROR: no .bin found in build/"
            exit 1
          fi
          echo "Found binary: $BIN"
          cp "$BIN" ai-passport-diy.bin
          sha256sum ai-passport-diy.bin > ai-passport-diy.bin.sha256
          ls -lh ai-passport-diy.bin
          cat ai-passport-diy.bin.sha256

      - name: Create Release
        if: success()
        uses: softprops/action-gh-release@v2
        with:
          tag_name: diy-${{ github.run_number }}-${{ github.sha }}
          name: "DIY Firmware ${{ github.run_number }}"
          draft: false
          prerelease: true
          body: |
            ## DIY Firmware Build

            Built from `main` of your fork with the 3 plugin demos.

            ### How to flash

            1. Download `ai-passport-diy.bin` below
            2. Open https://tool.folotoy.com/ in Chrome / Edge
            3. Click "刷机" (Flash) → connect USB → choose file → write at `0x0`
            4. Power-cycle Passport, you'll see the new 7-item menu including `Quick`

            Commit: `${{ github.sha }}`
          files: |
            ai-passport-diy.bin
            ai-passport-diy.bin.sha256
