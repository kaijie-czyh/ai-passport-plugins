# .github/workflows/build-firmware.yml
#
# 用途: 在你 fork 的 ai-passport 仓库上, 每次 push 自动编译并发布 .bin 到 Releases.

name: Build Firmware

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install host deps
        run: |
          sudo apt-get update
          sudo apt-get install -y git wget flex bison gperf python3 python3-pip \
            python3-venv cmake ninja-build ccache libffi-dev libssl-dev \
            dfu-util libusb-1.0-0

      - name: Install ESP-IDF v5.5.3
        run: |
          if [ ! -d "$HOME/esp/esp-idf" ]; then
            mkdir -p "$HOME/esp"
            cd "$HOME/esp"
            git clone --recursive --branch v5.5.3 \
              https://github.com/espressif/esp-idf.git esp-idf
            cd esp-idf
            ./install.sh esp32c3
          fi
          echo "ESP_IDF_PATH=$HOME/esp/esp-idf" >> "$GITHUB_ENV"

      - name: Build firmware
        run: |
          source "$HOME/esp/esp-idf/export.sh" > /dev/null 2>&1 || {
            echo "ERROR: failed to source export.sh"
            exit 1
          }
          echo "idf.py: $(which idf.py)"
          idf.py --version
          idf.py set-target esp32c3
          idf.py reconfigure
          idf.py build 2>&1 | tee build.log
          echo "=== build artifacts ==="
          find build -maxdepth 2 -name "*.bin" 2>&1
          ls -lh build/ | head -20

      - name: Upload build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log

      - name: Locate and merge factory image
        if: success()
        run: |
          source "$HOME/esp/esp-idf/export.sh" > /dev/null 2>&1
          APP=$(find build -maxdepth 2 -name "FoloToy-AI-Passport.bin" | head -1)
          BOOT=build/bootloader/bootloader.bin
          PTBL=build/partition_table/partition-table.bin
          if [ -z "$APP" ] || [ ! -f "$BOOT" ] || [ ! -f "$PTBL" ]; then
            echo "ERROR: missing artifacts (APP=$APP BOOT=$BOOT PTBL=$PTBL)"
            exit 1
          fi
          echo "Bootloader: $BOOT ($(stat -c%s "$BOOT") B)  Partition: $PTBL  App: $APP"
          # 合并成可在 0x0 直刷的全量镜像:
          #   0x00000 bootloader + 0x08000 partition table + 0x10000 app
          # (若不合并, 单独刷 app.bin 到 0x0 会导致 bootloader SHA 校验失败 → boot loop)
          python "$IDF_PATH/components/esptool_py/esptool/__init__.py" --chip esp32c3 \
            merge_bin -o ai-passport-diy.bin \
            --flash_mode dio --flash_size 8MB --flash_freq 80m \
            0x0     "$BOOT" \
            0x8000  "$PTBL" \
            0x10000 "$APP" || \
          python -m esptool --chip esp32c3 \
            merge_bin -o ai-passport-diy.bin \
            --flash_mode dio --flash_size 8MB --flash_freq 80m \
            0x0     "$BOOT" \
            0x8000  "$PTBL" \
            0x10000 "$APP"
          ls -lh ai-passport-diy.bin
          sha256sum ai-passport-diy.bin > ai-passport-diy.bin.sha256
          cat ai-passport-diy.bin.sha256

      # 诊断: 确认合并镜像的前 4 字节确实是 bootloader 头(0xE9), 而非 app.
      - name: Verify merged image
        if: success()
        run: |
          HD=$(od -An -t x1 -N4 ai-passport-diy.bin | tr -d ' ')
          echo "Bootloader header bytes: $HD (expect e9xxxxxx)"
          python "$IDF_PATH/components/esptool_py/esptool/__init__.py" image-info ai-passport-diy.bin 2>&1 || \
          python -m esptool image-info ai-passport-diy.bin 2>&1 || \
          echo "(esptool image-info failed)"

      - name: Create Release
        if: success()
        uses: softprops/action-gh-release@v2
        with:
          tag_name: diy-${{ github.run_number }}-${{ github.sha }}
          name: "DIY Firmware ${{ github.run_number }}"
          draft: false
          prerelease: true
          body: |
            ## AI Passport 3-Plugin Firmware

            Built from `main` of your fork. Includes the 7-item menu:
            Display / Button / Audio / Battery / **Companion** / **Quick** / **Flow**.

            ### How to flash

            1. Download `ai-passport-diy.bin` below
            2. Open https://tool.folotoy.com/ in Chrome / Edge
            3. Click "刷机" (Flash) → connect USB → choose file → write at `0x0`
            4. Power-cycle Passport

            Expected: screen shows a 7-item menu after boot.

            Commit: `${{ github.sha }}`
          files: |
            ai-passport-diy.bin
            ai-passport-diy.bin.sha256
