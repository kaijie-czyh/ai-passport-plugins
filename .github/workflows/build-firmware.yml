# .github/workflows/build-firmware.yml
#
# 用途: 在你 fork 的 ai-passport 仓库上, 每次 push 自动编译并发布 .bin 到 Releases.

name: Build Firmware

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install host deps
        run: |
          sudo apt-get update
          sudo apt-get install -y git wget flex bison gperf python3 python3-pip \
            python3-venv cmake ninja-build ccache libffi-dev libssl-dev \
            dfu-util libusb-1.0-0

      - name: Install ESP-IDF v5.5.3
        run: |
          if [ ! -d "$HOME/esp/esp-idf" ]; then
            mkdir -p "$HOME/esp"
            cd "$HOME/esp"
            git clone --recursive --branch v5.5.3 \
              https://github.com/espressif/esp-idf.git esp-idf
            cd esp-idf
            ./install.sh esp32c3
          fi
          echo "ESP_IDF_PATH=$HOME/esp/esp-idf" >> "$GITHUB_ENV"

      - name: Build firmware
        run: |
          source "$HOME/esp/esp-idf/export.sh" > /dev/null 2>&1 || {
            echo "ERROR: failed to source export.sh"
            exit 1
          }
          echo "idf.py: $(which idf.py)"
          idf.py --version
          idf.py set-target esp32c3
          idf.py reconfigure
          idf.py build 2>&1 | tee build.log
          echo "=== build artifacts ==="
          find build -maxdepth 2 -name "*.bin" 2>&1
          ls -lh build/ | head -20

      - name: Upload build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log

      - name: Locate and rename artifact
        if: success()
        run: |
          BIN=$(find build -maxdepth 2 -name "FoloToy-AI-Passport.bin" | head -1)
          if [ -z "$BIN" ]; then
            BIN=$(find build -maxdepth 2 -name "*.bin" | head -1)
          fi
          if [ -z "$BIN" ]; then
            echo "ERROR: no .bin found in build/"
            exit 1
          fi
          echo "Found binary: $BIN"
          cp "$BIN" ai-passport-diy.bin
          sha256sum ai-passport-diy.bin > ai-passport-diy.bin.sha256
          ls -lh ai-passport-diy.bin
          cat ai-passport-diy.bin.sha256

      # 关键诊断: 用 esptool image-info 看 .bin metadata, 确认 SHA-256 是否在 header 里正确写入
      - name: Inspect .bin metadata
        if: success()
        run: |
          source "$HOME/esp/esp-idf/export.sh" > /dev/null 2>&1
          BIN=$(find build -maxdepth 2 -name "FoloToy-AI-Passport.bin" | head -1)
          if [ -z "$BIN" ]; then
            BIN=$(find build -maxdepth 2 -name "*.bin" | head -1)
          fi
          echo "=== esptool image-info $BIN ==="
          python "$IDF_PATH/components/esptool_py/esptool/__init__.py" image-info "$BIN" 2>&1 || \
          python -m esptool image-info "$BIN" 2>&1 || \
          echo "(esptool image-info failed)"

      - name: Create Release
        if: success()
        uses: softprops/action-gh-release@v2
        with:
          tag_name: diy-${{ github.run_number }}-${{ github.sha }}
          name: "DIY Firmware ${{ github.run_number }}"
          draft: false
          prerelease: true
          body: |
            ## DIY Firmware Build (diagnostic minimal version)

            Built from `main` of your fork. This release uses a MINIMAL main.c
            that only displays "HELLO FROM DIY" on screen — no menu, no demos.

            Purpose: verify the firmware actually boots on real hardware.

            ### How to flash

            1. Download `ai-passport-diy.bin` below
            2. Open https://tool.folotoy.com/ in Chrome / Edge
            3. Click "刷机" (Flash) → connect USB → choose file → write at `0x0`
            4. Power-cycle Passport

            Expected: screen shows "HELLO FROM DIY" text on dark background.

            Commit: `${{ github.sha }}`
          files: |
            ai-passport-diy.bin
            ai-passport-diy.bin.sha256
