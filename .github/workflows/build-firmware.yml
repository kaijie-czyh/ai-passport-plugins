# .github/workflows/build-firmware.yml
#
# 用途: 在你 fork 的 ai-passport 仓库上, 每次 push 自动编译并发布 .bin 到 Releases.
# 这样你不用装 ESP-IDF, 直接从 Releases 页面下载 .bin, 用 https://tool.folotoy.com/ 刷入.

name: Build Firmware

on:
  push:
    branches: [main]
  workflow_dispatch:  # 允许手动触发

permissions:
  contents: write  # 创建 Release 需要

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install host deps
        run: |
          sudo apt-get update
          sudo apt-get install -y git wget flex bison gperf python3 python3-pip \
            python3-venv cmake ninja-build ccache libffi-dev libssl-dev \
            dfu-util libusb-1.0-0

      # 把 ESP-IDF 克隆到固定路径,然后在 build step 里 source export.sh.
      # 不用 esp-idf-ci-action (它在 step 之间不会持久化 PATH).
      - name: Install ESP-IDF v5.5.3
        run: |
          if [ ! -d "$HOME/esp/esp-idf-v5.5.3" ]; then
            mkdir -p "$HOME/esp"
            cd "$HOME/esp"
            git clone --recursive --branch v5.5.3 --depth 1 \
              https://github.com/espressif/esp-idf.git esp-idf-v5.5.3
            cd esp-idf-v5.5.3
            ./install.sh esp32c3
          else
            echo "ESP-IDF already installed, skipping"
          fi
          echo "ESP_IDF_PATH=$HOME/esp/esp-idf-v5.5.3" >> "$GITHUB_ENV"

      # 所有需要 idf.py 的命令集中在这里,前面 source export.sh
      - name: Build firmware
        run: |
          set -e
          source "$HOME/esp/esp-idf-v5.5.3/export.sh" > /dev/null
          echo "idf.py: $(which idf.py)"
          idf.py --version
          idf.py set-target esp32c3
          idf.py reconfigure
          idf.py build

      - name: Show build size
        run: |
          ls -lh build/ai-passport.bin

      - name: Rename artifact
        run: |
          cp build/ai-passport.bin ai-passport-diy.bin
          sha256sum ai-passport-diy.bin > ai-passport-diy.bin.sha256

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: diy-${{ github.run_number }}-${{ github.sha }}
          name: "DIY Firmware ${{ github.run_number }}"
          draft: false
          prerelease: true
          body: |
            ## DIY Firmware Build

            This release is automatically built from the `main` branch of your fork.

            ### How to flash

            1. Download `ai-passport-diy.bin` below
            2. Open https://tool.folotoy.com/ in Chrome / Edge
            3. Click "刷机" (Flash) → connect USB → choose file → write at `0x0`
            4. Power-cycle Passport, you'll see the new 7-item menu including `Quick`

            ### Files

            - `ai-passport-diy.bin` — merge image, write at 0x0
            - `ai-passport-diy.bin.sha256` — checksum for verification

            ### Verify build commit

            `${{ github.sha }}` on `${{ github.ref_name }}`
          files: |
            ai-passport-diy.bin
            ai-passport-diy.bin.sha256
